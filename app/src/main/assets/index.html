<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHANKS TUNNEL</title>
<style>
:root{--bg:#120c08;--card:rgba(14,10,7,.66);--deep:rgba(0,0,0,.42);--line:rgba(255,255,255,.17);--tx:#fff;--mut:#d3c3ad;--p:#b3201f;--green:#1f9d55;--vio:#7a3fd1;--yel:#ffd23f;--acc:#f5c542;--d:.55;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:0 16px 110px}
header{display:flex;align-items:center;gap:12px;padding:12px 10px;margin-top:10px;border-radius:22px;position:sticky;top:env(safe-area-inset-top,0px);background:rgba(10,7,5,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);z-index:5}
#bg,#dim{position:fixed;inset:0;z-index:-1}#dim{background:rgba(6,4,3,var(--d))}
.strip{height:8px;border-radius:99px;margin:10px 0;background:var(--strip,repeating-linear-gradient(90deg,#0b0b0b 0 10px,#d4a017 10px 16px,#b3201f 16px 26px,#0b6b3a 26px 32px))}
.th{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:3px solid transparent;border-radius:18px;height:120px;position:relative;cursor:pointer;overflow:hidden}.tile.on{border-color:var(--acc)}.tile span{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;background:rgba(0,0,0,.65);font-weight:700;font-size:14px}
input[type=range]{width:100%;accent-color:var(--acc)}
header h1{font-size:26px;margin:0;flex:1}
.ib{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--tx);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:18px}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--p),#1a0d06);border:2px solid var(--acc);display:grid;place-items:center}
.brand{flex:1;font-weight:800;letter-spacing:.04em;line-height:1.05}.brand small{display:block;color:var(--acc);font-size:13px}
.panel{background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:24px;padding:16px 18px;margin:12px 0}
.panel.tap{cursor:pointer}.panel.tap:active{filter:brightness(1.4)}
.panel b{font-size:19px;display:block}.panel small{color:var(--mut);font-size:14px;display:block;margin-top:4px}
.sub{color:var(--acc);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:22px 6px 8px;font-weight:700}
.ph{display:flex;gap:12px;align-items:center}.ph .e{font-size:30px;width:40px;text-align:center}.ph .t{flex:1;min-width:0}
.badge{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}.badge.ok{color:#4ade80;border-color:#14683a}
.con{display:grid;place-items:center;padding:26px 0 10px}
.cb{width:170px;height:170px;border-radius:50%;border:4px solid var(--p);background:radial-gradient(circle,rgba(40,25,15,.9),rgba(10,6,4,.95));color:var(--tx);font-size:18px;font-weight:700;cursor:pointer;display:grid;place-items:center;text-align:center;line-height:1.2}
.cb.on{border-color:var(--green);box-shadow:0 0 40px #00b26155}
.cb svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;margin-bottom:6px}
.st{text-align:center;color:var(--mut);margin-top:10px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span{color:var(--mut)}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer}
.sw i{position:absolute;inset:0;background:#5a4a3a;border-radius:99px;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--p)}.sw input:checked+i::after{transform:translateX(20px)}
.note{background:rgba(42,33,16,.8);border:1px solid #5a4510;color:#e3c46b;border-radius:16px;padding:10px 14px;font-size:13px;margin:12px 0}
.note.info{background:rgba(10,30,50,.7);border-color:#1d4a68;color:#8fc9f0}
.f{display:block;padding:10px 4px}.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;background:var(--deep);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px;font-family:inherit}
textarea{min-height:110px;resize:none}
.btn{background:var(--p);color:#fff;border:0;border-radius:99px;padding:13px 20px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.g{background:var(--green)}.btn.v{background:var(--vio)}.btn.w{width:100%}.btn.t{background:none;color:var(--mut)}
.bar{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}.bar .btn{flex:1;white-space:nowrap}
.seg{display:flex;gap:8px}.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:14px;padding:10px 6px;font-size:13px;cursor:pointer}
.seg input{display:none}.seg label:has(input:checked){border-color:var(--acc);background:rgba(255,255,255,.1);color:var(--acc);font-weight:700}
.rad{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}.rad:last-child{border:0}
.rad input{accent-color:var(--p);width:20px;height:20px}.rad small{margin:0}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;padding:16px;z-index:20;overflow:auto}.ov.on{display:flex}
.md{background:#1a100a;border:2px solid var(--acc);border-radius:30px;padding:22px;width:100%;max-width:520px;margin:auto}
.md h2{margin:0 0 14px;font-size:28px}
.idb{background:var(--deep);border-radius:22px;padding:16px;margin-bottom:14px}.idb .id{color:var(--yel);font-size:34px;font-weight:800;letter-spacing:.04em;margin:6px 0 12px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b1a10;border:1px solid var(--acc);padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}.toast.on{opacity:1}
@keyframes dash{to{stroke-dashoffset:-600}}
@keyframes pulse{50%{box-shadow:0 0 70px rgba(130,90,255,.9),inset 0 0 50px rgba(60,140,255,.6)}}
@keyframes wave{to{transform:translateX(-60px)}}
@keyframes comet{from{stroke-dashoffset:40}to{stroke-dashoffset:-560}}
@keyframes blink{50%{opacity:.3}}
.ttl{font-style:italic;font-weight:700;font-size:24px;line-height:1;background:linear-gradient(90deg,#fff,#c4a8ff 50%,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{position:relative;height:262px}.rings{position:absolute;left:50%;top:31px;margin-left:-181px}
.bub{position:absolute;left:50%;top:12px;margin-left:-118px;width:236px;height:236px;border-radius:50%;border:2px solid #9b7bff;overflow:hidden;background:radial-gradient(circle at 30% 22%,rgba(190,150,255,.5),rgba(22,12,70,.92) 55%,#060318 85%);box-shadow:0 0 40px rgba(110,70,255,.65),inset 0 0 40px rgba(60,140,255,.45);animation:pulse 3.5s ease-in-out infinite}
.bub.off{filter:saturate(.55);animation:none}
.liq{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(34,211,238,.3),rgba(139,92,255,.55))}
.wv{position:absolute;left:0;top:-6px;width:300px;height:12px;animation:wave 2.4s linear infinite}
.bc{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:20px}
.spd{display:flex;justify-content:space-between;margin:-30px 0 4px;position:relative}.spd .panel{flex:1;max-width:150px;padding:8px 12px;margin:0}
.cbtn{width:100%;height:58px;border:0;border-radius:30px;color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(90deg,#c026d3,#6d28d9 50%,#2563eb);box-shadow:0 0 26px rgba(150,90,255,.7);cursor:pointer;font-family:inherit}
#nv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:540px;display:flex;height:66px;background:rgba(14,9,48,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid #6d4cff;border-radius:22px;z-index:8}
#nv button{flex:1;background:none;border:0;color:#b9aeea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;cursor:pointer;font-family:inherit}
#nv svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nv button.on{color:#c4a8ff;box-shadow:inset 0 -3px 0 #a855f7}
.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}.chk input{width:22px;height:22px;accent-color:#ef4444;margin-top:2px;flex:none}.chk small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}.sf{padding:0 4px 10px 38px;border-bottom:1px solid var(--line)}
.xbtn{width:100%;height:60px;border:0;border-radius:16px;background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;font-size:18px;font-weight:800;letter-spacing:.04em;box-shadow:0 0 24px rgba(239,68,68,.45);cursor:pointer;font-family:inherit;margin-top:4px}
</style>
</head>
<body>
<div id="bg"></div><div id="dim"></div>
<main>
<header id="hd"></header><div class="strip"></div>
<div id="v"></div>
<footer style="text-align:center;color:var(--mut);margin-top:26px" id="ft"></footer>
</main>
<nav id="nv" aria-label="Navigation principale"></nav>
<div class="ov" id="ov"><div class="md">
 <h2>Saisir mon code</h2>
 <div class="idb"><div style="color:var(--mut)">Ton ID appareil (à donner à l’admin)</div><div class="id" id="mid"></div>
  <div class="bar"><button class="btn" id="cp">Copier</button><button class="btn" id="sd">Envoyer à l’admin</button></div></div>
 <textarea id="code" placeholder="Colle ici le code reçu (shs…)"></textarea>
 <div class="bar"><button class="btn" id="ps" style="flex:0">Coller</button><button class="btn" id="im">📂 Importer un fichier .shs</button></div>
 <input type="file" id="fi" accept=".shs,.txt,text/plain" hidden>
 <div class="bar"><button class="btn v" id="tr" style="flex:0">🎁 Demander un essai gratuit</button></div>
 <button class="btn g w" id="ok">Valider</button>
 <button class="btn t w" id="no" style="margin-top:6px">Annuler</button>
</div></div>
<div class="ov" id="ov2"><div class="md" id="md2"></div></div>
<div class="toast" id="to"></div>
<script>
// ===== Configuration (à adapter) =====
var CFG={app:'SHANKS TUNNEL',version:'2.0.1',dev:'SMD',devPhone:'+22604371179'};
// ===== Pont natif Android optionnel (window.AndroidVpn) =====
// getEngines() getInstalledApps() getDeviceId() getStatus() connect(json) disconnect()
// validateCode(code) requestTrial() shareToAdmin(id) isAdmin() saveConfig(json) action(name)
var N=window.AndroidVpn||null, ENG={};
try{if(N&&N.getEngines)ENG=JSON.parse(N.getEngines())}catch(e){}
function nat(fn){try{return N&&N[fn]?N[fn].apply(N,[].slice.call(arguments,1)):undefined}catch(e){}}

var KEY='shanks_v1';
var S={proto:{},apps:{mode:'except',sel:[]},vpnDns:true,dnsProv:'cf',dnsCustom:'',dnsRedirect:true,accel:false,devId:'',theme:'kente',dim:55,cfgs:[],cfgSel:'',files:[],lics:[],srv:{url:'',key:''}};
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in o)S[k]=o[k]}}catch(e){}
if(S.bgv!==3){S.theme='neon';S.dim=20;S.bgv=3}
function devId(){var n=nat('getDeviceId');if(n)return n;if(!S.devId){S.devId='ID-'+Array.from(crypto.getRandomValues(new Uint8Array(4))).map(function(b){return b.toString(16).padStart(2,'0')}).join('').toUpperCase();save()}return S.devId}
function save(m){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}nat('saveConfig',JSON.stringify(S));if(m)toast(m)}
function toast(m){var t=document.getElementById('to');t.textContent=m;t.className='toast on';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className='toast'},2200)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function copy(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('Copié')},function(){toast('Copie impossible')});else toast('Copie impossible')}
function sw(id,on){return '<span class="sw"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><i></i></span>'}
var avail=function(k){return !!ENG[k]};

var PROTOS={
 ssh:{n:'Shell sécurisé (SSH)',d:'Tunnel SSH (SOCKS dynamique)',e:'🖥️',f:[['host','Hôte','text'],['port','Port','number',22],['user','Utilisateur','text'],['pass','Mot de passe','password'],['key','Clé privée (optionnel)','text']]},
 v2ray:{n:'V2Ray / Xray',d:'VMess, VLESS, Trojan',e:'⚡',f:[['addr','Adresse du serveur','text'],['port','Port','number',443],['uuid','UUID / mot de passe','text'],['net','Transport','select',['tcp','ws','grpc','h2']],['sec','Sécurité','select',['none','tls','reality']],['sni','SNI','text'],['path','Chemin / service','text']]},
 hysteria:{n:'Hysteria',d:'Tunnel basé sur QUIC',e:'🚀',f:[['host','Serveur','text'],['port','Port','number',443],['auth','Authentification','password'],['obfs','Obfuscation (mot de passe)','password'],['sni','SNI','text'],['up','Montant (Mbps)','number',20],['down','Descendant (Mbps)','number',100]]},
 dnstt:{n:'DNSTT (DNS Tunnel)',d:'Tunnel via requêtes DNS',e:'🌐',f:[['domain','Domaine NS du tunnel','text'],['pub','Clé publique du serveur','text'],['mode','Type de résolveur','select',['DoH','DoT','UDP']],['resolver','Adresse du résolveur','text']]},
 ss:{n:'Shadowsocks',d:'Proxy chiffré AEAD',e:'🔐',f:[['host','Serveur','text'],['port','Port','number',8388],['pass','Mot de passe','password'],['method','Chiffrement','select',['chacha20-ietf-poly1305','aes-256-gcm','aes-128-gcm']],['plugin','Plugin (optionnel)','text']]}
};
var DNSP=[['cf','Cloudflare','1.1.1.1 · 1.0.0.1'],['gg','Google','8.8.8.8 · 8.8.4.4'],['q9','Quad9','9.9.9.9 · 149.112.112.112'],['custom','DNS personnalisé','Saisir une adresse']];
var DEMO=[['com.android.chrome','Chrome'],['com.whatsapp','WhatsApp'],['org.telegram.messenger','Telegram'],['com.google.android.youtube','YouTube'],['com.spotify.music','Spotify'],['com.instagram.android','Instagram'],['com.google.android.gm','Gmail'],['org.mozilla.firefox','Firefox']];
var PARENT={settings:'',adv:'settings',apps:'settings',dns:'adv',bg:'settings',bk:'settings',cfg:'settings',exp:'cfg',stats:'',srv:'',more:''};
for(var p in PROTOS)PARENT[p]='adv';

var HD=document.getElementById('hd'),V=document.getElementById('v'),FT=document.getElementById('ft');
function head(title,id){
 var h=id?'<button class="ib" id="bk" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h1>'+title+'</h1>':
  '<button class="ib" id="hm" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div style="flex:1;text-align:center"><div class="ttl">SHANKS TUNNEL</div><div style="font-size:11px;color:var(--mut);margin-top:5px">Rapide • Sécurisé • Sans Limite</div></div><button class="ib" id="bl" aria-label="Notifications"><svg viewBox="0 0 24 24" style="stroke:var(--acc)"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>';
 HD.innerHTML=h;
 var b=document.getElementById('bk');if(b)b.onclick=function(){location.hash=PARENT[id]};
 var hm=document.getElementById('hm');if(hm)hm.onclick=function(){location.hash='more'};var bl=document.getElementById('bl');if(bl)bl.onclick=function(){toast('Aucune notification')};
}
function route(){
 var h=location.hash.replace('#','');FT.textContent='';clearInterval(HT);navSet(h);
 if(h==='settings')return settings();
 if(h==='stats')return statsPage();
 if(h==='srv')return srvPage();
 if(h==='more')return morePage();
 if(h==='adv')return adv();
 if(h==='apps')return apps();
 if(h==='dns')return dns();
 if(h==='bg')return bgPage();
 if(h==='bk')return bkPage();
 if(h==='cfg')return cfgPage();
 if(h==='exp')return expPage();
 if(PROTOS[h])return proto(h);
 home();
}
window.addEventListener('hashchange',route);

// ===== Accueil =====
var state='off';
window.onVpnState=function(s){state=s;if(!location.hash)home()};
// ===== Paramètres (comme la capture) =====
function settings(){
 head('Paramètres','settings');
 var eng=Object.keys(ENG).filter(function(k){return ENG[k]});
 var items=[
  ['🔄','Update','Vérifier les mises à jour • contacter l’admin','update'],
  ['🆔','Mon ID appareil',devId()+' • touche pour copier','id'],
  ['💳','Abonnement','Voir les tarifs et choisir une durée','sub'],
  ['🤝','Revendeurs','Lots de codes à prix réduit','resell'],
  ['🧩','Applications','Choisir les applis qui ne passent pas par le VPN','#apps'],
  ['🎨','Fonds d’écran','Choisir un fond africain ou ta propre image','#bg'],
  ['📡','Configurations',S.cfgs.length+' enregistrée(s)'+(selCfg()?' • '+selCfg().name:'')+' • VLESS, VMess, Trojan, DNSTT','#cfg'],
  ['💾','Sauvegarde (.shs)','Exporter ou importer ta configuration','#bk'],
  ['🔧','Diagnostic moteur',eng.length?'Moteur VPN détecté ('+eng.length+' protocole(s))':'Aucun moteur détecté','diag'],
  ['🔐','Réglage','Réservé à l’administrateur','adm'],
  ['📣','Inviter un ami','Partage '+CFG.app+' avec tes contacts','inv'],
  ['⚡','Accélération',S.accel?'Activée • touche pour la désactiver':'Désactivée • touche pour l’activer','acc'],
  ['🧑‍💻','Développeur',CFG.dev+' • '+CFG.devPhone+' (WhatsApp)','dev']
 ];
 V.innerHTML=items.map(function(i,n){return '<div class="panel tap" data-a="'+i[3]+'"><div class="ph"><span class="e">'+i[0]+'</span><div class="t"><b>'+i[1]+'</b><small>'+esc(i[2])+'</small></div></div></div>'}).join('');
 FT.textContent=CFG.app+' • version '+CFG.version;V.insertAdjacentHTML('afterbegin',profHTML());
 V.querySelectorAll('[data-a]').forEach(function(el){el.onclick=function(){act(el.dataset.a)}});
}
function act(a){
 if(a[0]==='#')return location.hash=a.slice(1);
 if(a==='id')return copy(devId());
 if(a==='adm'){var ad=nat('isAdmin');if(N&&N.isAdmin&&!ad)return toast('Réservé à l’administrateur');return location.hash='adv'}
 if(a==='acc'){S.accel=!S.accel;save();return settings()}
 if(a==='dev')return copy(CFG.devPhone);
 if(a==='inv'&&navigator.share)return navigator.share({title:CFG.app,text:'Essaie '+CFG.app}).catch(function(){});
 if(N&&N.action)return nat('action',a);
 toast('Disponible dans l’application Android')
}

// ===== Réglages avancés (admin) =====
function adv(){
 head('Réglages avancés','adv');
 var h='<div class="sub">Tunnel</div>';
 Object.keys(PROTOS).forEach(function(k){var P=PROTOS[k],a=avail(k);
  h+='<div class="panel tap" data-g="'+k+'"><div class="ph"><span class="e">'+P.e+'</span><div class="t"><b style="font-size:17px">'+P.n+'</b><small>'+P.d+'</small></div><span class="badge'+(a?' ok':'')+'">'+(a?'Moteur actif':'Moteur non intégré')+'</span></div></div>'});
 h+='<div class="sub">Général</div><div class="panel"><div class="ph"><span class="e">🛰️</span><div class="t"><b style="font-size:17px">VPN DNS</b><small>Utiliser les DNS définis par le VPN</small></div>'+sw('vd',S.vpnDns)+'</div></div>'+
 '<div class="panel tap" data-g="dns"><div class="ph"><span class="e">📖</span><div class="t"><b style="font-size:17px">Serveur DNS</b><small>'+dnsLabel()+'</small></div></div></div>'+
 '<div class="panel"><div class="ph"><span class="e">↪️</span><div class="t"><b style="font-size:17px">Redirection DNS</b><small>Envoyer les requêtes DNS vers le serveur distant</small></div>'+sw('dr',S.dnsRedirect)+'</div></div>';
 V.innerHTML=h;
 V.querySelectorAll('[data-g]').forEach(function(e){e.onclick=function(){location.hash=e.dataset.g}});
 document.getElementById('vd').onchange=function(){S.vpnDns=this.checked;save('Enregistré')};
 document.getElementById('dr').onchange=function(){S.dnsRedirect=this.checked;save('Enregistré')};
}
function dnsLabel(){if(S.dnsProv==='custom')return S.dnsCustom?'Personnalisé · '+esc(S.dnsCustom):'Personnalisé (non défini)';var p=DNSP.filter(function(x){return x[0]===S.dnsProv})[0];return p[1]+' · '+p[2]}
function proto(id){
 var P=PROTOS[id],c=S.proto[id]=S.proto[id]||{};head(P.n,id);
 var h=avail(id)?'<div class="note info">Moteur intégré : cette configuration sera utilisée à la connexion.</div>':'<div class="note">Le moteur n’est pas intégré à cette version : la configuration est enregistrée mais aucun tunnel ne peut être établi.</div>';
 h+='<div class="panel">';
 P.f.forEach(function(f){var v=c[f[0]]!=null?c[f[0]]:(f[2]!=='select'&&f[3]!=null?f[3]:'');
  h+='<label class="f"><span>'+f[1]+'</span>'+(f[2]==='select'?'<select data-k="'+f[0]+'">'+f[3].map(function(o){return '<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')+'</select>':'<input data-k="'+f[0]+'" type="'+f[2]+'" value="'+esc(v)+'" autocomplete="off" autocapitalize="off" spellcheck="false">')+'</label>'});
 h+='<button class="btn w" id="sv" style="margin-top:8px">Enregistrer</button></div>';
 V.innerHTML=h;
 document.getElementById('sv').onclick=function(){V.querySelectorAll('[data-k]').forEach(function(e){c[e.dataset.k]=e.value});save('Configuration enregistrée')};
}
function dns(){
 head('Serveur DNS','dns');
 V.innerHTML='<div class="panel">'+DNSP.map(function(p){return '<label class="rad"><input type="radio" name="d" value="'+p[0]+'"'+(S.dnsProv===p[0]?' checked':'')+'><div><b style="font-size:16px">'+p[1]+(p[0]==='cf'?' (par défaut)':'')+'</b><small>'+p[2]+'</small></div></label>'}).join('')+
 '<label class="f" id="cw" style="display:'+(S.dnsProv==='custom'?'block':'none')+'"><span>Adresse DNS personnalisée (IPv4 / IPv6)</span><input type="text" id="cd2" value="'+esc(S.dnsCustom)+'" placeholder="9.9.9.9"></label></div>'+
 '<div class="note info">Redirection DNS activée : requêtes envoyées dans le tunnel, selon sa configuration. Désactivée : résolution locale selon la configuration du VPN. Aucune protection DNS n’est garantie si le moteur n’est pas actif.</div>';
 V.querySelectorAll('input[name=d]').forEach(function(r){r.onchange=function(){S.dnsProv=r.value;document.getElementById('cw').style.display=r.value==='custom'?'block':'none';save('Enregistré')}});
 document.getElementById('cd2').onchange=function(){var v=this.value.trim();if(v&&!(/^(\d{1,3}\.){3}\d{1,3}$/.test(v)||(v.indexOf(':')>-1&&/^[0-9a-f:]+$/i.test(v))))return toast('Adresse IP invalide');S.dnsCustom=v;save('Enregistré')};
}

function apps(){
 head('Applications','apps');
 var real=false,list=DEMO.map(function(d){return{pkg:d[0],name:d[1]}});
 try{if(N&&N.getInstalledApps){list=JSON.parse(N.getInstalledApps());real=true}}catch(e){}
 list.sort(function(a,b){return a.name.localeCompare(b.name)});
 var sel=new Set(S.apps.sel);
 V.innerHTML=(real?'':'<div class="note">Liste de démonstration. Sur Android, la liste réelle des applications installées est fournie par l’app.</div>')+
 '<div class="panel"><div class="seg"><label><input type="radio" name="m" value="only"'+(S.apps.mode==='only'?' checked':'')+'><span>VPN uniquement pour la sélection</span></label><label><input type="radio" name="m" value="except"'+(S.apps.mode==='except'?' checked':'')+'><span>VPN pour tout sauf la sélection</span></label></div>'+
 '<div class="note info" id="hn"></div><div class="bar"><button class="btn" id="al">Tout sélectionner</button><button class="btn" id="nn">Tout désélectionner</button></div>'+
 '<label class="f"><span>Rechercher</span><input type="text" id="q" placeholder="Nom de l’application"></label><div id="ls"></div></div>';
 function hint(){document.getElementById('hn').textContent=(S.apps.mode==='only'?'addAllowedApplication : seules ':'addDisallowedApplication : toutes sauf ')+sel.size+' application(s) cochée(s).'}
 function commit(){S.apps.sel=Array.from(sel);save();hint()}
 function paint(){var q=document.getElementById('q').value.toLowerCase();
  document.getElementById('ls').innerHTML=list.filter(function(a){return a.name.toLowerCase().indexOf(q)>-1}).map(function(a){return '<label class="rad"><input type="checkbox" data-p="'+esc(a.pkg)+'"'+(sel.has(a.pkg)?' checked':'')+'><div><b style="font-size:16px">'+esc(a.name)+'</b><small>'+esc(a.pkg)+'</small></div></label>'}).join('');
  document.querySelectorAll('[data-p]').forEach(function(c){c.onchange=function(){c.checked?sel.add(c.dataset.p):sel.delete(c.dataset.p);commit()}});hint()}
 document.querySelectorAll('input[name=m]').forEach(function(r){r.onchange=function(){S.apps.mode=r.value;save('Mode enregistré');hint()}});
 document.getElementById('al').onclick=function(){list.forEach(function(a){sel.add(a.pkg)});commit();paint()};
 document.getElementById('nn').onclick=function(){sel.clear();commit();paint()};
 document.getElementById('q').oninput=paint;paint();
}

var OV=document.getElementById('ov'),CODE=document.getElementById('code');
function openCode(){document.getElementById('mid').textContent=devId();OV.className='ov on'}
function closeCode(){OV.className='ov'}
document.getElementById('no').onclick=closeCode;
document.getElementById('cp').onclick=function(){copy(devId())};
document.getElementById('sd').onclick=function(){
 if(N&&N.shareToAdmin)return nat('shareToAdmin',devId());
 var t='Mon ID appareil '+CFG.app+' : '+devId();
 if(navigator.share)navigator.share({text:t}).catch(function(){});else copy(t)};
document.getElementById('ps').onclick=function(){if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(function(t){CODE.value=t.trim()},function(){toast('Collage refusé')});else toast('Collage indisponible')};
document.getElementById('im').onclick=function(){document.getElementById('fi').click()};
document.getElementById('fi').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){CODE.value=String(r.result).trim()};r.readAsText(f)};
document.getElementById('tr').onclick=function(){if(N&&N.requestTrial)nat('requestTrial');else toast('Demande d’essai : disponible dans l’application Android')};
document.getElementById('ok').onclick=function(){
 var c=CODE.value.trim();
 if(!c)return toast('Saisis un code');
 if(c.charAt(0)==='{')return toast('Ceci est une sauvegarde : utilise Paramètres › Sauvegarde');
 if(N&&N.validateCode){var m=nat('validateCode',c);toast(m||'Code envoyé pour validation');closeCode()}
 else toast('Validation impossible en aperçu : elle se fait côté application')};

// ===== Licences : fichiers verrouillés (vérifiés par le serveur) =====
var MSG={invalid:'Fichier ou clé invalide',revoked:'CONFIGURATION RÉVOQUÉE par l’administrateur',file_expired:'Fichier expiré : importation impossible',wrong_device:'Fichier verrouillé sur un autre appareil',root:'Appareil rooté : utilisation interdite',expired:'CONFIGURATION EXPIRÉE',quota:'LIMITE DE DONNÉES ATTEINTE'};
var LM={},LB=0;
function hw(){return nat('getDeviceId')||devId()}
function fd(t){return t?new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'—'}
function post(u,p,b,h){var o={'content-type':'application/json'};if(h)o.authorization='Bearer '+h;return fetch(u.replace(/\/+$/,'')+p,{method:'POST',headers:o,body:JSON.stringify(b)}).then(function(r){return r.json()},function(){throw 'Serveur injoignable : vérifie ta connexion'})}
function actv(l){return post(l.srv,'/api/activate',{id:l.id,key:l.key,hwid:hw(),root:!!nat('isRooted')}).then(function(m){LM[l.id]={m:m,t0:performance.now(),c:m.configs};delete m.configs;return LM[l.id]})}
function impLic(t){var o;try{o=JSON.parse(t)}catch(e){return Promise.reject('Fichier .shs invalide')}
 if(!/^https:\/\//.test(o.srv||'')||!o.id||!o.key)return Promise.reject('Fichier verrouillé incomplet');
 if(o.fileExp&&Date.now()>=o.fileExp)return Promise.reject(MSG.file_expired);
 var l={srv:o.srv,id:o.id,key:o.key,name:o.name||'Configuration'};
 return actv(l).then(function(e){var s=e.m.status;if(s!=='active'&&s!=='expired'&&s!=='quota')throw MSG[s]||'Refusé par le serveur';S.lics=S.lics.filter(function(x){return x.id!==l.id});S.lics.push(l);save();return l})}
function refreshLics(){S.lics.forEach(function(l){actv(l).then(function(e){if(state==='on'&&e.m.status!=='active')nat('disconnect')}).catch(function(){})})}
function licHTML(){return S.lics.map(function(l){var e=LM[l.id];if(!e)return '<div class="panel"><small>Vérification de « '+esc(l.name)+' »…</small></div>';
 var m=e.m,now=(m.now||0)+(performance.now()-e.t0),a=m.activatedAt,x=m.expiresAt,
 txt=m.status!=='active'?(MSG[m.status]||'Accès refusé'):(x&&now>=x?MSG.expired:''),
 pct=x&&a?Math.max(0,Math.min(100,(x-now)/(x-a)*100)):100,days=x?Math.max(0,Math.ceil((x-now)/864e5)):0;
 return '<div class="panel" style="margin:0 0 12px;'+(txt?'border-color:#ef4444':'')+'"><b>'+esc(m.name||l.name)+'</b>'+(m.creator?' <small>par '+esc(m.creator)+'</small>':'')+
 (txt?'<div style="color:#f87171;font-weight:700;margin:8px 0">'+txt+'</div>':'')+
 (x?'<div style="height:10px;border-radius:9px;background:#26204f;margin:10px 0 6px;overflow:hidden"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:linear-gradient(90deg,#22d3ee,#a855f7)"></div></div><div class="kv"><span>Validité restante</span><b>'+pct.toFixed(0)+' % • '+days+' j</b></div>':'')+
 '<div class="kv"><span>Activée le</span><b>'+fd(a)+'</b></div><div class="kv"><span>Expire le</span><b>'+(x?fd(x):'Jamais')+'</b></div>'+
 (m.capMB?'<div class="kv"><span>Données</span><b>'+(m.usedMB||0).toFixed(0)+' / '+m.capMB+' Mo</b></div>':'')+
 (m.noteHome?'<div class="note info" style="margin:8px 0 0">'+esc(m.noteHome)+'</div>':'')+'</div>'}).join('')}
function profHTML(){var h=S.lics.map(function(l){var m=LM[l.id]&&LM[l.id].m;return m&&m.noteProfile?'<div class="panel" style="margin:0 0 10px"><b>'+esc(m.name||l.name)+'</b><small>'+esc(m.noteProfile)+(m.creator?' — '+esc(m.creator):'')+'</small></div>':''}).join('');return h}
function connectLic(){var l=S.lics[0];actv(l).then(function(e){var m=e.m;
 if(m.status!=='active')return toast(MSG[m.status]||'Accès refusé');
 if(m.noWifi&&nat('getNetType')==='wifi')return toast('Utilisation via Wi-Fi interdite : utilise les données mobiles');
 if(!e.c||!e.c.length)return toast('Aucune configuration fournie par le serveur');
 var p=Object.assign({},S,{active:e.c[0],configs:e.c});delete p.lics;delete p.srv;nat('connect',JSON.stringify(p))}).catch(function(e){toast(String(e))})}
setInterval(function(){refreshLics();var s={};try{s=JSON.parse(nat('getStats')||'{}')}catch(e){}var b=(s.rx||0)+(s.tx||0),d=b-LB;LB=b;if(d>0&&s.state==='on'&&S.lics[0])post(S.lics[0].srv,'/api/usage',{id:S.lics[0].id,key:S.lics[0].key,hwid:hw(),mb:d/1048576}).catch(function(){})},300000);
refreshLics();
